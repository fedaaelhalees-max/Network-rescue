<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070d24">
<title>مغامرة إنقاذ الشبكة</title>
<style>
:root{
  /* مدينة رقمية ليلية: كحلي عميق، سماوي للتقنية، أصفر شمسي للمكافآت. التخطيط: مشهد 3D في الخلف ولوحة سفلية (جانبية على الشاشات العريضة) */
  --bg:#070d24; --panel:#0d163af2; --panel2:#15235a; --line:#2c4391; --ink:#eef3ff; --mute:#a3b4e2;
  --cy:#38e1ff; --sun:#ffd166; --ok:#4ade80; --bad:#ff8a8a; --vio:#8b7bff;
  --font:"Segoe UI","Noto Kufi Arabic","Noto Sans Arabic","Geeza Pro","Dubai",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;overflow:hidden;-webkit-tap-highlight-color:transparent;position:relative}
body.no3d{background:radial-gradient(circle at 50% 20%,#1b2a6e,#070d24 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.no3d #gl{display:none}
#labels,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;top:0;left:0;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:#070d24cc;border:1px solid var(--line);white-space:nowrap;will-change:transform}
.lbl.ip{direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--sun)}
.lbl.rt{color:#cfc8ff;border-color:var(--vio)}
.lbl.netA{color:#2dd4bf}.lbl.netB{color:#ffc94d}.lbl.netC{color:#ff7ac3}
.lbl.cube{font-size:22px;background:none;border:0;text-shadow:0 2px 8px #000;direction:ltr}
.lbl.gate{font-size:30px;background:none;border:0;text-shadow:0 2px 10px #000}
#fx span{position:absolute;font-size:26px;animation:up 1.4s ease-out forwards}
@keyframes up{from{transform:translate(0,30px) scale(.4);opacity:0}25%{opacity:1}to{transform:translate(var(--dx),-150px) scale(1.2);opacity:0}}
.cf{position:absolute;top:-12px;width:9px;height:15px;border-radius:2px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r));opacity:.85}}

button,input,select,textarea{font:inherit;color:inherit}
.btn{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--cy)} .btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#48e6ff,#18b4dd);color:#04122e;border-color:#9bf1ff}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;font-size:19px;width:100%}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;align-self:flex-start;font-size:12.5px;font-weight:700;color:#04122e;background:var(--sun);padding:0 10px;border-radius:20px}
.en{font-size:12px;letter-spacing:.12em;color:var(--cy);font-weight:700;direction:ltr;display:inline-block}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}.wrap{flex-wrap:wrap}

/* الشريط العلوي */
#hud{position:absolute;top:0;right:0;left:0;height:54px;padding:6px 10px 6px 58px;display:flex;align-items:center;gap:8px;background:linear-gradient(#070d24f0,#070d2400);z-index:5}
#hud[hidden]{display:none}
.ic{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#0d163ad9;font-size:19px;cursor:pointer;flex:none}
#b-snd{position:absolute;top:6px;left:8px;z-index:6}
.hud-mid{flex:1;min-width:0}
#hud-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:8px;background:#1a2a66;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--sun));border-radius:8px;transition:width .4s}
.chipx{font-size:13px;font-weight:700;background:#0d163ad9;border:1.5px solid var(--line);border-radius:10px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chipx .ok{color:var(--ok)}.chipx .bad{color:var(--bad)}

/* فقاعة الروبوت */
#bubble{position:absolute;top:66px;right:112px;left:12px;max-width:330px;margin-inline-start:auto;background:#fff;color:#0b1538;border-radius:14px 4px 14px 14px;padding:7px 12px;font-size:14px;font-weight:600;line-height:1.5;z-index:4;pointer-events:none;box-shadow:0 6px 20px #0008}
#bubble b{display:block;font-size:10px;letter-spacing:.1em;color:#1375a8;direction:ltr;text-align:right}
#bubble.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
body[data-lay=party] #bubble{top:12px;right:50%;left:auto;transform:translateX(50%);border-radius:14px}
body[data-lay=party] #bubble.pop{animation:none}
body[data-lay=home] #bubble,body[data-lay=full] #bubble{display:none}

/* اللوحة السفلية */
#ui{position:absolute;inset:0;pointer-events:none;z-index:3}
#ui>*{pointer-events:auto}
.sheet{position:absolute;right:0;left:0;bottom:0;max-height:56%;overflow:auto;background:var(--panel);border-top:2px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(6px)}
body[data-lay=gates] .sheet{max-height:52%} body[data-lay=party] .sheet{max-height:60%}
.sheet h2{font-size:18px;line-height:1.5;text-wrap:balance}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.qact{display:flex;gap:10px;justify-content:space-between;margin-top:4px;position:sticky;bottom:-14px;background:linear-gradient(#0d163a00,#0d163a 30%);padding:10px 0 4px}
.qact .pri{flex:1}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:48px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);text-align:start;cursor:pointer;font-weight:600}
.opts.two .opt{text-align:center;font-size:18px}
.opt.ok,.slot.ok{border-color:var(--ok);background:#14532d;color:#d7ffe4}
.opt.bad,.slot.bad{border-color:var(--bad);background:#5b1f2a;color:#ffe1e1;opacity:.8}
.locked .opt,.locked .mi,.locked .oi,.locked .slot,.locked .chip2{cursor:default}
.fb{border-radius:12px;padding:9px 12px;border:1.5px solid var(--line);font-size:14.5px}
.fb[hidden]{display:none}
.fb b{display:block;font-size:15.5px}
.fb.ok{border-color:var(--ok);background:#0f3d24}.fb.ok b{color:var(--ok)}
.fb.retry,.fb.hint{border-color:var(--sun);background:#3f3210}.fb.retry b,.fb.hint b{color:var(--sun)}
.fb.bad{border-color:var(--bad);background:#43192a}.fb.bad b{color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.match>div{display:grid;gap:7px;align-content:start}
.mi,.oi{position:relative;min-height:46px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;font-weight:600;text-align:start}
.mi.sel{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.mi[data-n]::after,.oi[data-n]::after{content:attr(data-n);position:absolute;top:-8px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#04122e;font-size:13px;font-weight:800;display:grid;place-items:center}
.mi.c0{border-color:#38e1ff}.mi.c1{border-color:#ffd166}.mi.c2{border-color:#ff7ac3}.mi.c3{border-color:#4ade80}
.mi.c0::after{background:#38e1ff}.mi.c2::after{background:#ff7ac3}.mi.c3::after{background:#4ade80}
.order{display:grid;gap:8px}.oi.sel{border-color:var(--cy);background:#123a66}
.slots,.chips{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.slots i{font-size:26px;font-weight:800;font-style:normal;color:var(--sun)}
.slot{width:64px;height:52px;border-radius:12px;border:2px dashed var(--line);background:#0a1230;font:800 20px ui-monospace,Consolas,monospace;cursor:pointer}
.slot.full{border-style:solid;border-color:var(--cy)}
.chip2{min-width:60px;height:48px;border-radius:12px;border:1.5px solid var(--vio);background:#2a2470;font:800 19px ui-monospace,Consolas,monospace;cursor:grab;touch-action:none}
.chip2.used{opacity:.25}
.chip2.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:50;opacity:.9}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:38px}
.chain span{background:#2a2470;border:1.5px solid var(--vio);border-radius:10px;padding:2px 10px;font-weight:700}.chain i{font-style:normal;color:var(--sun)}
.bits{margin:6px auto;border-collapse:collapse;font:700 14px ui-monospace,Consolas,monospace}
.bits th{color:var(--mute);font-size:11px;padding:0 5px}.bits td{border:1.5px solid var(--line);width:30px;height:30px;text-align:center;border-radius:4px}
.bits td.on{background:var(--sun);color:#04122e}
.info{border:1.5px solid var(--cy);border-radius:12px;padding:8px 12px;background:#0b2a4a;font-size:14.5px}

/* الرئيسية */
.scr.home{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none!important}
.hero{padding:54px 18px 34px;text-align:center;background:linear-gradient(#070d24fa 72%,#070d2400);pointer-events:none}
.kick{font-size:13px;letter-spacing:.3em;color:var(--cy);font-weight:800;direction:ltr}
.hero h1{font-size:clamp(28px,8vw,44px);line-height:1.35;text-shadow:0 0 24px #38e1ff88;text-wrap:balance}
.lead{font-size:14.5px;max-width:34em;margin:4px auto 0;color:#d4def8}.lead b{color:var(--sun);display:block}
.menu{pointer-events:auto;padding:26px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#070d2400,#070d24f2 22%);display:flex;flex-direction:column;gap:9px;max-width:520px;width:100%;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .btn{font-size:14.5px;padding:6px 8px}
.who{font-size:14px;text-align:center;color:var(--mute)}.who b{color:var(--ink)}
.credit{text-align:center;font-size:13.5px;font-weight:700;color:var(--sun);line-height:1.5}

/* بطاقات المستويات */
.cards{display:grid;gap:9px}
.card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);text-align:start;width:100%}
button.card{cursor:pointer}
.card .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#04122e;flex:none}
.lv1 .num{background:#2dd4bf}.lv2 .num{background:#ffc94d}.lv3 .num{background:#ff7ac3}
.cbody{flex:1;display:grid;min-width:0}.cbody small{color:var(--mute);font-size:12.5px}.cbody .en{color:var(--cy)}
.card .st{color:var(--sun);font-size:18px;white-space:nowrap}
.card.locked{opacity:.55}
.party{text-align:center;align-items:stretch}.party .tag{align-self:center}
.stars{font-size:46px;line-height:1;letter-spacing:8px;color:#33437e;direction:ltr}
.stars .on.pop{color:var(--sun);animation:starpop .45s ease-out;text-shadow:0 0 18px #ffd166}
@keyframes starpop{from{transform:scale(2.2);opacity:0}}.stars span{display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stats div{background:#0a1230;border:1.5px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
.stats b{direction:ltr;unicode-bidi:isolate;display:block;font-size:20px;color:var(--cy);font-variant-numeric:tabular-nums}.stats small{font-size:11.5px;color:var(--mute);line-height:1.3;display:block}

/* الصفحات الكاملة */
.page{position:absolute;inset:0;overflow:auto;background:#070d24ee;padding:60px max(16px,calc(50% - 440px)) 40px;display:flex;flex-direction:column;gap:12px}
.page>*{flex-shrink:0}
.page.narrow{padding-inline:max(16px,calc(50% - 240px))}
.page h2{font-size:21px}.page h3{font-size:16.5px;color:var(--sun);margin-top:8px}
.how{padding-inline-start:22px;display:grid;gap:6px}
.note{font-size:13.5px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#0d163a}
.note.ok{border-color:var(--ok)}.note.bad{border-color:var(--bad)} b.bad{color:var(--bad)}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}
.tb{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb th{background:#15235a;font-size:12.5px;color:var(--mute);padding:8px 10px;text-align:start}
.tb td{padding:8px 10px;border-top:1px solid #1f3070}.tb tr.me td{background:#123a66;font-weight:700}
.medals{display:flex;flex-wrap:wrap;gap:10px}.medal{font-size:34px;text-align:center;background:#0d163a;border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;line-height:1.3}.medal small{display:block;font-size:11.5px;color:var(--mute)}
.log{list-style:none;padding:0;display:grid;gap:4px;font-size:14px}.log time{color:var(--mute);font-size:12px;margin-inline-end:6px}
.tabs{display:flex;gap:6px;overflow-x:auto}.tab{min-height:42px;padding:4px 14px;border-radius:10px 10px 0 0;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700;white-space:nowrap}.tab.on{background:var(--panel2);border-color:var(--cy);color:var(--cy)}
label{font-size:14px;font-weight:700;display:block;margin-top:8px}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:#0a1230;padding:8px 12px;margin-top:4px}
textarea{min-height:0;font-size:13px}
.form{display:grid;gap:2px}.form input+input{margin-top:6px}
fieldset{border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;margin-top:8px}fieldset label,.qlist label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:4px}
input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:4px}
.qlist{list-style:none;padding:0;display:grid;gap:6px;font-size:13.5px}.qlist li{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #1f3070;padding-bottom:5px}
details{border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;background:#0d163a}summary{cursor:pointer;font-weight:700;min-height:34px}
details p{font-size:14px;margin-top:4px}
pre{font:12px ui-monospace,Consolas,monospace;background:#050a1c;border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.filebtn{margin:0}
.certimg{max-width:100%;border-radius:10px;border:1.5px solid var(--line);display:block}
.rev{padding-inline-start:20px;display:grid;gap:6px;font-size:14.5px}

#toast{position:absolute;bottom:18px;left:50%;transform:translate(-50%,30px);background:#fff;color:#0b1538;padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:#030718cc;z-index:20;display:grid;place-items:center;padding:16px;overflow:auto}
#modal[hidden]{display:none}
.mbox{background:#0d163a;border:2px solid var(--line);border-radius:18px;padding:18px;width:min(480px,100%);max-height:100%;overflow:auto}
.mbox h3{font-size:18px;color:var(--sun)}
#printarea{display:none}

/* الشاشات العريضة: اللوحة جانبية */
body.wide .sheet{top:0;bottom:0;right:auto;width:min(460px,42%);max-height:none!important;border-radius:0;border-top:0;border-right:2px solid var(--line);padding-top:20px;justify-content:center}
body.wide #hud{left:min(460px,42%);padding-left:10px}
body.wide #bubble{right:210px;left:auto;top:84px}
body.wide .scr.home{right:auto;width:min(460px,42%);background:#070d24e6;justify-content:center}
body.wide .hero,body.wide .menu{background:none}
@media (max-height:640px){.lead{display:none}.hero{padding-top:50px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block}#printarea img{width:100%}body{background:#fff;overflow:visible}@page{size:landscape;margin:8mm}}

</style>
</head>
<body data-lay="home">
<canvas id="gl" aria-label="مدينة رقمية ثلاثية الأبعاد"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<header id="hud" hidden>
  <button class="ic" id="b-home" aria-label="الرئيسية">🏠</button>
  <div class="hud-mid"><div id="hud-title"></div><span class="bar"><i id="hud-bar"></i></span></div>
  <span class="chipx">⭐ <b id="hud-pts">0</b></span>
  <span class="chipx"><span class="ok">✔ <b id="hud-ok">0</b></span> <span class="bad">✘ <b id="hud-bad">0</b></span></span>
</header>
<button class="ic" id="b-snd" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
<div id="bubble" hidden role="status"></div>
<main id="ui"></main>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<div id="printarea"></div>
<script>
'use strict';
/* ===== محرك ثلاثي الأبعاد خفيف مبني على WebGL مباشرة (بدون مكتبات خارجية) ===== */
const E = (() => {
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias: true, alpha: false, powerPreference: 'low-power' });
  const api = { ok: !!gl, cityGlow: 0.25, onFrame: null, onPick: null, labels: [] };
  if (!gl) return api;

  // ---------- رياضيات المصفوفات ----------
  const mul = (a, b) => {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    return o;
  };
  const rotm = (r) => {
    const cx = Math.cos(r[0]), sx = Math.sin(r[0]), cy = Math.cos(r[1]), sy = Math.sin(r[1]), cz = Math.cos(r[2]), sz = Math.sin(r[2]);
    const o = new Float32Array(16);
    o[0] = cy * cz + sy * sx * sz; o[1] = cx * sz; o[2] = -sy * cz + cy * sx * sz;
    o[4] = -cy * sz + sy * sx * cz; o[5] = cx * cz; o[6] = sy * sz + cy * sx * cz;
    o[8] = sy * cx; o[9] = -sx; o[10] = cy * cx; o[15] = 1;
    return o;
  };
  const trs = (p, r, s) => {
    const o = rotm(r);
    o[0] *= s[0]; o[1] *= s[0]; o[2] *= s[0];
    o[4] *= s[1]; o[5] *= s[1]; o[6] *= s[1];
    o[8] *= s[2]; o[9] *= s[2]; o[10] *= s[2];
    o[12] = p[0]; o[13] = p[1]; o[14] = p[2];
    return o;
  };
  const persp = (fov, asp, n, f) => {
    const t = 1 / Math.tan(fov / 2), o = new Float32Array(16);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f);
    return o;
  };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function pool(lv) { return BANK.concat(S.settings.customQ || []).filter(q => q.lv === lv && !(S.settings.disabledQ || []).includes(q.id) && (E.ok || q.type !== 'scene')); }

  const all = pool(lv), rc = LEVELS[lv].recipe, last = new Set(p.lv[lv].lastSet || []), out = [];
  let need = 0;
  for (const t in rc) { need += rc[t]; const c = shuffle(all.filter(q => q.type === t)).sort((a, b) => last.has(a.id) - last.has(b.id)); out.push(...c.slice(0, rc[t])); }
  if (out.length < need) { const rest = shuffle(all.filter(q => !out.includes(q))).sort((a, b) => last.has(a.id) - last.has(b.id)); out.push(...rest.slice(0, need - out.length)); }

      el.innerHTML = `<p class="mute">👆 اضغطي على الموجّهات في المدينة بالترتيب الذي ستسلكه الحزمة.</p><div class="chain">${seq.length ? seq.map(r => `<span>${W.RNAME[r]}</span>`).join('<i>←</i>') : '<em>لم تختاري أي موجّه بعد</em>'}</div><div class="row"><button class="btn ghost sm" id="pth-undo" ${seq.length ? '' : 'disabled'}>تراجع</button></div>`;

const nameOf = id => id[0] === 'R' ? W.RNAME[id] : id[0] === 'Q' ? 'المكعب ' + OCT[+id[1]][0] : W.pcs[id] ? 'الجهاز ' + W.pcs[id].ip : id;

// ---------- المهمة الكبرى في المستوى الثالث ----------
function mission() {

    { id: 'm2', lv: 3, type: 'scene', cam: 'left', keep: true, types: ['A', 'B', 'C'], targets: [src], q: `الحزمة أرسلها الجهاز صاحب العنوان ${sip}. اضغطي على الجهاز المصدر.`, hint: 'المصدر في الشبكة (أ)؛ اقرئي العناوين فوق أجهزتها.', exp: 'المصدر هو الجهاز الذي أرسل الحزمة.' },

    { id: 'm4', lv: 3, type: 'path', cam: 'mid', keep: true, seq: ['R1', 'R2', 'R3'], q: 'حدّدي أقصر مسار تسلكه الحزمة عبر الموجّهات من الشبكة (أ) إلى الشبكة (ج).', hint: 'يوجد مساران؛ اختاري الذي يمر بأقل عدد من الموجّهات، وابدئي بالموجّه 1.', exp: 'أقصر الطرق: موجّه 1 ثم موجّه 2 ثم موجّه 3. الموجّه يوجّه الرسالة عبر أقصر الطرق.' }

// ---------- إنهاء المستوى واحتساب النتيجة ----------
function finishLevel() {
  if (!run.lv) return finishPlacement();
  const p = me(), l = p.lv[run.lv], max = run.total * PER_Q, pct = Math.round(run.pts / max * 100), passed = pct >= S.settings.pass;
  const score = run.pts + BONUS_DONE + (passed ? BONUS_PASS : 0), stars = !passed ? 0 : pct >= 95 ? 3 : pct >= 85 ? 2 : 1;
  const wasAll = passedCount(p) === 3;
  l.tries++; l.lastSet = run.items.map(q => q.id);
  const improved = score > l.best;
  if (improved) { l.best = score; l.ok = run.ok; l.bad = run.bad; }
  l.pct = Math.max(l.pct, pct); l.stars = Math.max(l.stars, stars); l.passed = l.passed || passed;
  logP(p, `المستوى ${run.lv}: ${pct}% (${score} نقطة) — ${passed ? 'اجتياز' : 'لم يكتمل بعد'}`);
  if (!wasAll && passedCount(p) === 3) { p.certDate = Date.now(); logP(p, 'أتمّت المستويات الثلاثة واستحقت شهادة الإنجاز'); }
  save(); Cloud.push(p);
  celebrate({ lv: run.lv, pct, passed, score, stars, ok: run.ok, bad: run.bad, improved, best: l.best });
}
